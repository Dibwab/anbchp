<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Digital Pledge Wall Display</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  <script src="firebase.js"></script>
</head>
<body style="background:#000; color:#0ff; font-family:sans-serif; overflow:hidden;">
  <h1 style="text-align:center; color:#0ff;">Digital Pledge Wall</h1>
  <div id="pledges" style="text-align:center; font-size:22px;"></div>

  <script>
    const pledgesDiv = document.getElementById("pledges");

    db.ref("pledges").on("child_added", snap => {
      const data = snap.val();
      const div = document.createElement("div");
      div.style.margin = "10px";
      div.style.animation = "fadeIn 1s ease-out";
      div.innerHTML = `<strong>${data.name}</strong> has pledged!`;
      pledgesDiv.prepend(div);
    });
  </script>

  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Digital Pledge Form</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  <script src="firebase.js"></script>
</head>
<body style="font-family:sans-serif; text-align:center; background:#f4f6f8;">
  <h2>Digital Pledge</h2>
  <p>Enter your name and sign below:</p>
  <input id="name" placeholder="Your Name" style="padding:8px; width:220px;"><br><br>
  
  <canvas id="sigCanvas" width="250" height="100" style="border:1px solid #999; background:white;"></canvas><br>
  <button onclick="clearSig()">Clear</button><br><br>
  
  <button onclick="submitPledge()" style="padding:10px 25px; font-size:16px;">Submit Pledge</button>

  <script>
    const canvas = document.getElementById("sigCanvas");
    const ctx = canvas.getContext("2d");
    let drawing = false;

    canvas.addEventListener("mousedown", () => drawing = true);
    canvas.addEventListener("mouseup", () => drawing = false);
    canvas.addEventListener("mousemove", draw);
    function draw(e){
      if(!drawing) return;
      ctx.lineWidth = 2;
      ctx.lineCap = "round";
      ctx.strokeStyle = "black";
      ctx.lineTo(e.offsetX, e.offsetY);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(e.offsetX, e.offsetY);
    }

    function clearSig(){ ctx.clearRect(0,0,canvas.width,canvas.height); }

    function submitPledge(){
      const name = document.getElementById("name").value.trim();
      const sigData = canvas.toDataURL();
      if(!name){ alert("Please enter your name."); return; }
      db.ref("pledges").push({ name, signature: sigData, time: Date.now() });
      alert("✅ Thank you for your digital pledge!");
      clearSig();
      document.getElementById("name").value = "";
    }
  </script>
</body>
</html>
